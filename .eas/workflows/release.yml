name: Release

# Only version tags (e.g. v1.2.0) build and publish. Pushes to main run nothing.
on:
  push:
    tags:
      - "v*"

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: preview

  publish_release:
    name: Publish release
    needs: [build_android]
    # Injects the EAS environment variable PUBLISH_RELEASE_SECRET into the shell.
    environment: production
    steps:
      - name: Publish release
        run: |
          set -euo pipefail
          BUILD_ID="${{ needs.build_android.outputs.build_id }}"
          VERSION="${{ needs.build_android.outputs.app_version }}"

          # The edge function resolves the APK URL from the build id.
          echo "Publishing version $VERSION (build $BUILD_ID)"
          curl -fsS -X POST \
            "https://uzhgghcnpueakvyaypuz.supabase.co/functions/v1/publish-release" \
            -H "Content-Type: application/json" \
            -H "x-publish-secret: $PUBLISH_RELEASE_SECRET" \
            -d "{\"version\":\"${VERSION}\",\"build_id\":\"${BUILD_ID}\"}"
